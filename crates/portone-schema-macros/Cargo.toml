[package]
name = "portone-schema-macros"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_json = "1.0.151"
syn = "2.0.119"

[dev-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "2.0.119", features = ["full"] }
tempfile = "3.27.0"
